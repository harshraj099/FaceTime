server:
  port: ${PORT:8080}

spring:
  application:
    name: yoom-backend
  # local secrets live in backend/.env (gitignored); real env vars take precedence
  config:
    import: optional:file:.env[.properties]
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/yoom}
      auto-index-creation: true

yoom:
  jwt:
    # must be at least 32 characters
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:7d}
  stream:
    api-key: ${STREAM_API_KEY}
    api-secret: ${STREAM_API_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
